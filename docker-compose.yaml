services:
  postgres:
    image: postgres:18
    container_name: lookana-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: lookana
      POSTGRES_PASSWORD: db123
      POSTGRES_DB: lookana_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
