<app-new-service-window
    [visible]="newServiceWindowIsVisible"
>   
</app-new-service-window>

<main class="monitoring-area">
    <div class="app-monitor-block">
        <div class="service-details">
            <div class="service-logo">
                <p>M</p>
            </div>
            <div class="service-name-details">
                <h3 class="service-name">
                    Money.t
                </h3>
                <p class="service-dns">
                    https://moneyt.com
                </p>
            </div>
        </div>

        <div class="service-status">
            <h1>Rodando</h1>
            <p class="last-ping">
                Última consulta: 21/09/2026 22h47
            </p>
        </div>
    </div>

    <button 
        id="add-new-service"
        (click)="openNewServiceWindow()">
        <span class="material-symbols-outlined">
        add
        </span>

        New service
    </button>
</main>
